[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obr-explorer"
version = "0.1.0"
description = "Análise geoespacial em escala de bilhões de linhas com DuckDB sobre o dataset Google-Microsoft Open Buildings, com foco em cidades brasileiras e webmap comparativo."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Pedro Luiz Rodrigues Vaz de Melo" },
]
keywords = [
    "duckdb",
    "geospatial",
    "open-buildings",
    "brazil",
    "geoparquet",
    "cloud-analytics",
    "leaflet",
    "webmap",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "duckdb>=1.3",
    "geopandas>=1.0",
    "pyarrow>=15.0",
    "pyogrio>=0.10",
    "shapely>=2.1",
    "pyproj>=3.7",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

notebook = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "folium>=0.16",
]

[project.scripts]
obr-explorer = "obr_explorer.cli:main"

[project.urls]
Homepage = "https://github.com/PedroLuizskt/open-buildings-explorer-br"
Repository = "https://github.com/PedroLuizskt/open-buildings-explorer-br"
Issues = "https://github.com/PedroLuizskt/open-buildings-explorer-br/issues"

# =============================================================================
# Hatch build configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/obr_explorer"]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p", "no:cacheprovider",
    "--cov=obr_explorer",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "-m", "not network",
]
markers = [
    "network: testes que requerem acesso à internet (S3 público). Rodam apenas com --marker=network.",
    "slow: testes que levam mais de 5 segundos.",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src/obr_explorer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_empty = true

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # nomes de teste podem ter camelCase

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
